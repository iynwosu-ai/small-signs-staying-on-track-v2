name: Deploy Rise Course

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Rise course
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          find . -maxdepth 1 -mindepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            ! -name "extracted" \
            -exec rm -rf {} +

          cp -R extracted/content/. .

          rm -rf extracted

      - name: Commit Rise files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Rise course" || echo "No changes to commit"
          git push

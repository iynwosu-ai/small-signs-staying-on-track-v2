name: Deploy Rise Course

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Rise course
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          mkdir rise-export
          unzip -q "$ZIP" -d rise-export

          find . -maxdepth 1 \
            ! -name "." \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          cp -R rise-export/content/. .

          rm -rf rise-export
          rm -f "$ZIP"

      - name: Commit Rise files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Rise course" || echo "No changes to commit"
          git push
